name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - "**"
        tags:
            - "v*"

jobs:
    test:
        name: Test pinned DE441 data with ASan
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-python@v7.0.0
              with:
                  python-version: "3.11"

            - name: Download checksum-pinned ephemeris fixture
              run: python tests/fetch_ephemeris.py --destination .test-data/ephe

            - name: Build extension with AddressSanitizer
              run: python setup.py build_ext --inplace
              env:
                  CFLAGS: -O2 -fsanitize=address -fno-omit-frame-pointer
                  LDFLAGS: -fsanitize=address

            - name: Build official swetest reference executable
              run: make -C libswe swetest

            - name: Run randomized suite and fixed-star parity checks
              run: |
                  export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
                  python tests/run.py --seed "$GITHUB_RUN_ID"
                  python tests/verify_swetest.py --swetest libswe/swetest
              env:
                  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
                  PYTHONMALLOC: malloc
                  SE_EPHE_PATH: ${{ github.workspace }}/.test-data/ephe

    build_src_wheel:
        name: Build source wheel
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-python@v7.0.0
              name: Install Python 3.11
              with:
                  python-version: 3.11

            - name: Update to latest pip
              run: |
                  python -m pip install -U setuptools pip wheel

            - name: Build wheel
              run: |
                  python setup.py sdist -d wheelhouse

            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: distribution-source
                  path: wheelhouse

    build_plat_wheels:
        strategy:
            matrix:
                os: ["ubuntu-latest", "windows-latest", "macos-latest"]

        name: Build platform wheels on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-python@v7.0.0
              name: Install Python 3.11
              with:
                  python-version: 3.11

            - name: Install cibuildwheel
              run: |
                  python -m pip install cibuildwheel~=2.0

            - name: Build wheel
              run: |
                  python -m cibuildwheel --output-dir wheelhouse
              env:
                  CIBW_BUILD: cp*
                  CIBW_ARCHS_MACOS: universal2

            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: distribution-${{ matrix.os }}
                  path: ./wheelhouse

    pypi_upload:
        needs: [test, build_src_wheel, build_plat_wheels]
        name: Upload wheels to pypi
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')

        steps:
            - uses: actions/download-artifact@v8.0.1
              with:
                  pattern: distribution-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@v1.14.2
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_TOKEN }}
